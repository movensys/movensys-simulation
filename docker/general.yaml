services:
  movensys_manipulator:
    restart: unless-stopped
    build:
      context: .
      dockerfile: general.Dockerfile
      network: host
      args:
        - ROS_DISTRO=${ROS_DISTRO}
        - HOST_USER_UID=${HOST_USER_UID}
        - HOST_USER_GID=${HOST_USER_GID}
    image: ${IMAGE_NAME}
    container_name: ${CONTAINER_NAME}
    privileged: true
    network_mode: host
    ipc: host
    working_dir: /home/admin/workspaces
    entrypoint: ["/ros_entrypoint.sh"]
    stdin_open: true
    tty: true
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - HOST_USER_UID=${HOST_USER_UID}
      - HOST_USER_GID=${HOST_USER_GID}
      - USER=${USER}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
      - CYCLONEDDS_URI=file:///home/admin/workspaces/cyclonedds.xml
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - ROS_DISTRO=${ROS_DISTRO}
    volumes:
      - ${MOVENSYS_MANIPULATOR_PACKAGES}:/home/admin/workspaces/movensys_manipulator_ws/src/movensys-manipulator:rw
      - ${CYCLONEDDS_DIR}:/home/admin/workspaces/cyclonedds.xml:ro
      - /etc/localtime:/etc/localtime:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/dri:/dev/dri
    devices:
      - /dev/dri
    command: ["/bin/bash","-lc",
              "source /opt/ros/${ROS_DISTRO}/setup.bash && \

               echo ====== Build movensys_manipulator ======= && \
               cd /home/admin/workspaces/movensys_manipulator_ws && \
               mkdir -p /home/admin/ws/{build,install,test_results,colcon_logs} && \
               colcon --log-base /home/admin/ws/colcon_logs build \
                  --build-base /home/admin/ws/build \
                  --install-base /home/admin/ws/install \
                  --test-result-base /home/admin/ws/test_results \
                  --symlink-install && \

               echo ====== Build Terminated ======= && \
               source /home/admin/ws/install/setup.bash && \
               export RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION} && \
               exec bash"
              ]
